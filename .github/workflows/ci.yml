name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately. The line-ending and path
        # separator bugs this project hit were invisible on Linux, so a
        # Linux-only matrix cannot be trusted to catch them.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # Keep the matrix to a sane size: full coverage on the newest
          # interpreter, spot checks on the others.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone carries no tags, so the update-detection
          # tests cannot see what they assert about. Tags are part of this
          # project's release contract, not an optimisation to skip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Run the suite, and on failure print the interpreter context plus the
      # failing assertions into the same log. `if: failure()` on a later step is
      # unreliable here; doing it inline guarantees the detail is captured.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/tests.log || {
            echo "::group::environment"
            python -c "import platform,sys;print('python',sys.version.replace(chr(10),' '));print('platform',platform.platform());print('machine',platform.machine())"
            echo "cwd: $(pwd)"
            echo "::endgroup::"
            echo "::group::failure detail"
            grep -E "^(FAIL|ERROR):|^AssertionError|^Ran |^FAILED|skipTest|Error:" /tmp/tests.log | head -40
            echo "::endgroup::"
            exit 1
          }
      - name: Skill metadata lint
        run: python skills/aletheia/scripts/router.py lint --root skills
      - name: Zero-dependency YAML fallback lint
        run: python -S skills/aletheia/scripts/router.py lint --root skills
      # The runner has no PyYAML, which is exactly why this exists: the
      # no-dependency parser must reach the same verdict as the PyYAML one.
      # Without it, a skill can pass locally and fail only on Linux CI.
      - name: Zero-dependency parity check
        run: python tests/zero_dependency_check.py
      - name: Routing smoke evaluation
        run: python skills/aletheia/scripts/router.py eval --root tests/fixtures --cases tests/eval_cases.json
      - name: Compile Python
        run: python -m compileall -q skills/aletheia/scripts scripts

  no-pyyaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Prove the standard library is genuinely enough: PyYAML installed here
      # would mask exactly the bug this job exists to catch.
      - name: Full test suite without PyYAML
        run: python tests/zero_dependency_check.py
      - name: Discovery works with the standard library alone
        run: python skills/aletheia/scripts/router.py scan --root tests/fixtures
      - name: Hosts and skills resolvable without third-party packages
        run: python skills/aletheia/scripts/router.py hosts
